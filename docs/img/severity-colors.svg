<svg xmlns="http://www.w3.org/2000/svg" width="620" height="398" viewBox="0 0 620 398" role="img" aria-label="Severity colours of the DWD widgets">
<style>
    .bg { fill: #ffffff; }
    .frame { stroke: #d0d7de; }
    .head { fill: #57606a; font: 600 12px system-ui, sans-serif; letter-spacing: .04em; }
    .val  { fill: #24292f; font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .txt  { fill: #24292f; font: 13px system-ui, sans-serif; }
    .hex  { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<rect class="bg frame" x="0.5" y="0.5" width="619" height="397" rx="8"/>
<text class="head" x="16" y="30">SEVERITY</text>
<text class="head" x="90" y="30">COLOUR AND TEXT</text>
<text class="head" x="316" y="30">MEANING</text>
<text class="val" x="16" y="63">0</text>
<rect class="frame" x="90.5" y="46.5" width="209" height="23" rx="4" fill="none" stroke-dasharray="3 3"/>
<text class="txt" x="100" y="63" opacity="0.6">transparent</text>
<text class="txt" x="316" y="63">no colour</text>
<text class="val" x="16" y="97">1</text>
<rect x="90" y="80" width="210" height="24" rx="4" fill="#ffeb3b"/>
<text class="hex" x="100" y="97" fill="#000000">#ffeb3b  Minor</text>
<text class="txt" x="316" y="97">Wetterwarnung</text>
<text class="val" x="16" y="131">2</text>
<rect x="90" y="114" width="210" height="24" rx="4" fill="#fb8c00"/>
<text class="hex" x="100" y="131" fill="#000000">#fb8c00  Moderate</text>
<text class="txt" x="316" y="131">markantes Wetter</text>
<text class="val" x="16" y="165">3</text>
<rect x="90" y="148" width="210" height="24" rx="4" fill="#e53935"/>
<text class="hex" x="100" y="165" fill="#ffffff">#e53935  Severe</text>
<text class="txt" x="316" y="165">Unwetter</text>
<text class="val" x="16" y="199">4</text>
<rect x="90" y="182" width="210" height="24" rx="4" fill="#880e4f"/>
<text class="hex" x="100" y="199" fill="#ffffff">#880e4f  Extreme</text>
<text class="txt" x="316" y="199">extremes Unwetter</text>
<text class="val" x="16" y="233">9</text>
<rect x="90" y="216" width="210" height="24" rx="4" fill="#c99afe"/>
<text class="hex" x="100" y="233" fill="#000000">#c99afe  Heat Warning</text>
<text class="txt" x="316" y="233">Hitzewarnung</text>
<text class="val" x="16" y="267">11</text>
<rect x="90" y="250" width="210" height="24" rx="4" fill="#c9f"/>
<text class="hex" x="100" y="267" fill="#000000">#c9f  No Warning</text>
<text class="txt" x="316" y="267">keine Warnung</text>
<text class="val" x="16" y="301">19</text>
<rect x="90" y="284" width="210" height="24" rx="4" fill="#fe68fe"/>
<text class="hex" x="100" y="301" fill="#000000">#fe68fe  UV Warning</text>
<text class="txt" x="316" y="301">UV-Warnung</text>
<text class="val" x="16" y="335">49</text>
<rect x="90" y="318" width="210" height="24" rx="4" fill="#e966fe"/>
<text class="hex" x="100" y="335" fill="#000000">#e966fe  Strong Heat</text>
<text class="txt" x="316" y="335">starke Hitze</text>
<text class="val" x="16" y="369">50</text>
<rect x="90" y="352" width="210" height="24" rx="4" fill="#f933fe"/>
<text class="hex" x="100" y="369" fill="#ffffff">#f933fe  Extreme Heat</text>
<text class="txt" x="316" y="369">extreme Hitze</text>
</svg>
